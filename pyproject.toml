[project]
name = "lixto"
version = "0.1.0"
description = "Lixto — AI procurement agent for Brazilian public tenders (PNCP)"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "psycopg[binary]>=3.1",
    "httpx>=0.28.1",
    "openai>=1.60",
    "pypdf>=5",
    "pypdfium2>=5.13.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
scrape = [
    "playwright>=1.50",
    "camoufox[geoip]>=0.4",
]

[project.scripts]
lixto = "lixto.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lixto"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without these, pytest would import `tests/lixto/` as the top-level package
# `lixto` and shadow the installed one; together they name it `tests.lixto`.
addopts = "--import-mode=importlib"
consider_namespace_packages = true
