# Local development: uses ./web/uploads (gitignored) for document storage.
# Production (Dokploy): mount a named volume at /app/uploads.

name: lixto

services:
  db:
    image: pgvector/pgvector:pg16-trixie
    environment:
      POSTGRES_USER: lixto
      POSTGRES_PASSWORD: lixto
      POSTGRES_DB: lixto
    ports:
      - "5433:5432"
    volumes:
      - lixto_pgdata:/var/lib/postgresql/data

volumes:
  lixto_pgdata:
