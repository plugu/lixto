# Local development: uses ./web/uploads (gitignored) for document storage.
# Production (Dokploy): mount a named volume at /app/uploads.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: plic
      POSTGRES_PASSWORD: plic
      POSTGRES_DB: plic
    ports:
      - "5433:5432"
    volumes:
      - plic_pgdata:/var/lib/postgresql/data

volumes:
  plic_pgdata:
